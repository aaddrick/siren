<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siren Creator!</title>
<style>
:root {
  --bg-primary: #1a1a2e;
  --bg-panel: #16213e;
  --bg-control: #0f3460;
  --text-primary: #e0e0e0;
  --text-accent: #ffffff;
  --accent-blue: #2196F3;
  --accent-orange: #FF9800;
  --accent-green: #4CAF50;
  --accent-red: #F44336;
  --ring-color-1: #FF6B6B;
  --ring-color-2: #4ECDC4;
  --ring-color-3: #FFE66D;
  --ring-color-4: #A8E6CF;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --font-main: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(280px, 420px) 1fr;
  grid-template-areas:
    "title title"
    "canvas controls"
    "presets presets";
  gap: 12px;
  padding: 12px;
  font-size: 18px;
}

@media (max-width: 700px) {
  body {
    grid-template-columns: 1fr;
    grid-template-areas:
      "title"
      "canvas"
      "controls"
      "presets";
  }
}

/* --- Title Bar --- */
.title-bar {
  grid-area: title;
  text-align: center;
  padding: 12px;
  background: var(--bg-panel);
  border-radius: var(--radius-md);
}
.title-bar h1 {
  font-size: 28px;
  font-weight: 800;
  color: var(--text-accent);
  letter-spacing: 2px;
}

/* --- Canvas Area --- */
.canvas-area {
  grid-area: canvas;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--bg-panel);
  border-radius: var(--radius-md);
}
#rotor-canvas {
  width: 100%;
  max-width: 400px;
  aspect-ratio: 4/5;
  border-radius: var(--radius-md);
  background: #0d0d18;
}
.rpm-bar-container {
  width: 100%;
  max-width: 400px;
  height: 24px;
  background: #111;
  border-radius: var(--radius-sm);
  overflow: hidden;
  position: relative;
}
.rpm-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-green), #ffeb3b, var(--accent-red));
  border-radius: var(--radius-sm);
  transition: width 0.05s linear;
}
.rpm-label {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: white;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
#waveform-canvas {
  width: 100%;
  max-width: 400px;
  height: 80px;
  border-radius: var(--radius-sm);
  background: #0d0d18;
}
.viz-toggle {
  display: flex;
  gap: 6px;
  justify-content: center;
}
.viz-btn {
  flex: 1;
  max-width: 120px;
  padding: 8px;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.viz-btn.active {
  border-color: var(--accent-blue);
  background: rgba(33,150,243,0.15);
}
.freq-display {
  width: 100%;
  max-width: 400px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  min-height: 20px;
}
.freq-chip {
  font-size: 13px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 10px;
  color: white;
}

/* --- Controls Panel --- */
.controls {
  grid-area: controls;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  background: var(--bg-panel);
  border-radius: var(--radius-md);
  overflow-y: auto;
}

/* --- Big Button --- */
.btn-start {
  width: 100%;
  padding: 20px;
  font-size: 24px;
  font-weight: 800;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: white;
  background: var(--accent-green);
  transition: transform 0.1s, box-shadow 0.2s;
  min-height: 64px;
  letter-spacing: 1px;
}
.btn-start:hover { transform: scale(1.03); }
.btn-start:active { transform: scale(0.97); }
.btn-start.running {
  background: var(--accent-red);
  animation: pulse-glow 1.5s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(244,67,54,0.4); }
  50% { box-shadow: 0 0 24px rgba(244,67,54,0.8); }
}

/* --- Control Group --- */
.control-group {
  background: var(--bg-control);
  border-radius: var(--radius-md);
  padding: 14px;
}
.control-group label {
  display: block;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--accent-blue);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.control-group .value-display {
  font-size: 14px;
  color: var(--text-accent);
  float: right;
  font-weight: 600;
}

/* --- Sliders --- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 12px;
  border-radius: 6px;
  background: #1a1a2e;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent-blue);
  border: 3px solid white;
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent-blue);
  border: 3px solid white;
  cursor: pointer;
}

/* --- Mode Buttons --- */
.mode-group {
  display: flex;
  gap: 8px;
}
.mode-btn {
  flex: 1;
  padding: 12px 8px;
  border: 3px solid transparent;
  border-radius: var(--radius-md);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.mode-btn.active {
  border-color: var(--accent-orange);
  background: rgba(255, 152, 0, 0.15);
  color: var(--text-accent);
}
.mode-btn:hover { background: rgba(255,255,255,0.05); }
.mode-btn .icon { font-size: 20px; display: block; margin-bottom: 4px; }

/* --- Ring Controls --- */
.ring-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ring-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ring-badge {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: inline-block;
  vertical-align: middle;
}
.ring-actions { display: flex; gap: 6px; }
.btn-small {
  padding: 6px 14px;
  border: 2px solid var(--accent-blue);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent-blue);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
.btn-small:hover { background: rgba(33,150,243,0.15); }
.btn-small.danger { border-color: var(--accent-red); color: var(--accent-red); }
.btn-small.danger:hover { background: rgba(244,67,54,0.15); }

.ring-item {
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  padding: 10px;
  border-left: 4px solid var(--ring-color-1);
  cursor: pointer;
  transition: background 0.15s;
}
.ring-item:hover { background: rgba(255,255,255,0.06); }
.ring-item.selected { background: rgba(255,255,255,0.08); }
.ring-item.disabled { opacity: 0.4; }

.shape-toggle {
  display: flex;
  gap: 6px;
}
.shape-btn {
  flex: 1;
  padding: 8px;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 18px;
  cursor: pointer;
  text-align: center;
}
.shape-btn.active {
  border-color: var(--accent-blue);
  background: rgba(33,150,243,0.15);
}

/* --- Presets Bar --- */
.presets-bar {
  grid-area: presets;
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--bg-panel);
  border-radius: var(--radius-md);
  overflow-x: auto;
  flex-wrap: wrap;
}
.preset-btn {
  flex: 1;
  min-width: 120px;
  padding: 12px 16px;
  border: 2px solid transparent;
  border-radius: var(--radius-md);
  background: var(--bg-control);
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, transform 0.1s;
  white-space: nowrap;
}
.preset-btn:hover { border-color: var(--accent-blue); transform: scale(1.03); }
.preset-btn.active { border-color: var(--accent-orange); }
.preset-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }

.save-load-btns {
  display: flex;
  gap: 8px;
}
.btn-save, .btn-load, .btn-share {
  padding: 12px 16px;
  border: 2px solid var(--accent-blue);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--accent-blue);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.btn-save:hover, .btn-load:hover, .btn-share:hover {
  background: rgba(33,150,243,0.15);
}
.btn-record {
  padding: 12px 16px;
  border: 2px solid var(--accent-red);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--accent-red);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, border-color 0.2s;
}
.btn-record:hover {
  background: rgba(244,67,54,0.15);
}
.btn-record:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-record.recording {
  background: rgba(244,67,54,0.2);
  animation: record-pulse 1.2s ease-in-out infinite;
}
@keyframes record-pulse {
  0%, 100% { box-shadow: 0 0 4px rgba(244,67,54,0.3); border-color: var(--accent-red); }
  50% { box-shadow: 0 0 16px rgba(244,67,54,0.7); border-color: #ff7961; }
}

/* --- Modal --- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-panel);
  border-radius: var(--radius-lg);
  padding: 24px;
  min-width: 300px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 {
  font-size: 22px;
  margin-bottom: 16px;
  color: var(--text-accent);
}
.modal input[type="text"] {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--accent-blue);
  background: var(--bg-primary);
  color: var(--text-accent);
  margin-bottom: 12px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.btn-modal {
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: white;
}
.btn-modal.primary { background: var(--accent-green); }
.btn-modal.secondary { background: var(--bg-control); }
.btn-modal.danger { background: var(--accent-red); }

.save-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px;
  background: var(--bg-control);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
}
.save-list-item:hover { background: rgba(33,150,243,0.15); }
.save-list-item .name { font-weight: 600; }
.save-list-item .date { font-size: 13px; color: #888; }

/* --- Advanced Toggle --- */
.advanced-toggle {
  padding: 10px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: #888;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.advanced-toggle:hover { color: var(--text-primary); }
.advanced-content { display: none; }
.advanced-content.open { display: block; }

/* --- Error banner --- */
.error-banner {
  display: none;
  background: var(--accent-red);
  color: white;
  padding: 16px;
  border-radius: var(--radius-md);
  text-align: center;
  font-weight: 600;
  font-size: 16px;
}
.error-banner.show { display: block; }

/* --- Build/Tune Mode Toggle --- */
.mode-toggle-bar {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}
.mode-toggle-btn {
  padding: 8px 24px;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--bg-control);
  color: var(--text-primary);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.mode-toggle-btn.active {
  border-color: var(--accent-orange);
  background: rgba(255, 152, 0, 0.15);
  color: var(--text-accent);
}
.mode-toggle-btn:hover { background: rgba(255,255,255,0.05); }

/* --- Build Mode --- */
#tune-panel { display: flex; flex-direction: column; gap: 12px; }
.build-panel { display: flex; flex-direction: column; gap: 12px; }

.parts-bin {
  background: var(--bg-control);
  border-radius: var(--radius-md);
  padding: 14px;
}
.parts-bin h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-blue);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.parts-section { margin-bottom: 12px; }
.parts-section:last-child { margin-bottom: 0; }
.parts-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-orange);
  margin-bottom: 6px;
}
.parts-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.part-card {
  padding: 8px 12px;
  background: var(--bg-primary);
  border: 2px solid #444;
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
  cursor: grab;
  transition: border-color 0.15s, transform 0.1s;
  user-select: none;
}
.part-card:hover {
  border-color: var(--accent-blue);
  transform: scale(1.05);
}
.part-card:active { cursor: grabbing; }
.part-card .part-label { display: block; font-weight: 700; }
.part-card .part-detail { font-size: 11px; color: #888; }

.assembly-area {
  background: var(--bg-control);
  border-radius: var(--radius-md);
  padding: 14px;
}
.assembly-area h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-green);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.assembly-slots {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.assembly-slot {
  min-height: 60px;
  border: 2px dashed #555;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  transition: border-color 0.15s, background 0.15s;
}
.assembly-slot .slot-label {
  color: #666;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
}
.assembly-slot.drag-over {
  border-color: var(--accent-green);
  background: rgba(76, 175, 80, 0.1);
}
.assembly-slot.filled {
  border-style: solid;
  border-color: var(--accent-blue);
  background: rgba(33, 150, 243, 0.08);
  justify-content: space-between;
}
.assembly-slot.filled .slot-part-name {
  font-weight: 700;
  color: var(--text-accent);
  font-size: 14px;
}
.assembly-slot.filled .slot-part-detail {
  font-size: 12px;
  color: #888;
}
.assembly-slot .slot-remove {
  padding: 4px 10px;
  border: 1px solid var(--accent-red);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent-red);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.assembly-slot .slot-remove:hover {
  background: rgba(244, 67, 54, 0.15);
}
.assembly-message {
  text-align: center;
  font-size: 13px;
  color: var(--accent-orange);
  padding: 8px;
  font-weight: 600;
}
.build-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.btn-clear-assembly {
  padding: 10px 24px;
  border: 2px solid var(--accent-red);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent-red);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.btn-clear-assembly:hover {
  background: rgba(244, 67, 54, 0.15);
}

/* --- Tap overlay --- */
.tap-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.tap-overlay.hidden { display: none; }
.tap-overlay h2 {
  font-size: 36px;
  color: var(--text-accent);
  margin-bottom: 12px;
}
.tap-overlay p {
  font-size: 20px;
  color: #aaa;
}
</style>
</head>
<body>

<!-- Tap-to-start overlay (required for AudioContext user gesture) -->
<div class="tap-overlay" id="tap-overlay">
  <h2>SIREN CREATOR</h2>
  <p>Tap anywhere to start!</p>
</div>

<!-- Title -->
<div class="title-bar">
  <h1>SIREN CREATOR</h1>
  <div class="mode-toggle-bar">
    <button class="mode-toggle-btn" id="btn-mode-build" data-appmode="build">&#x1F527; Build</button>
    <button class="mode-toggle-btn active" id="btn-mode-tune" data-appmode="tune">&#x1F39B;&#xFE0F; Tune</button>
  </div>
</div>

<!-- Canvas Area -->
<div class="canvas-area">
  <canvas id="rotor-canvas" width="400" height="500"></canvas>
  <div class="rpm-bar-container">
    <div class="rpm-bar-fill" id="rpm-bar"></div>
    <div class="rpm-label" id="rpm-label">0 RPM</div>
  </div>
  <div class="viz-toggle">
    <button class="viz-btn active" id="viz-wave">Wave</button>
    <button class="viz-btn" id="viz-spectrum">Spectrum</button>
  </div>
  <canvas id="waveform-canvas" width="400" height="80"></canvas>
  <div class="freq-display" id="freq-display"></div>
  <div class="error-banner" id="error-banner"></div>
</div>

<!-- Controls -->
<div class="controls">
  <!-- Tune Panel (default visible) -->
  <div id="tune-panel">
    <button class="btn-start" id="btn-start">START</button>

    <div class="control-group">
      <label>How Fast? <span class="value-display" id="speed-display">3450 RPM</span></label>
      <input type="range" id="speed-slider" min="500" max="10000" value="3450" step="50">
    </div>

  <div class="control-group">
    <label>Mode</label>
    <div class="mode-group">
      <button class="mode-btn active" data-mode="steady"><span class="icon">&#x2500;</span>STEADY</button>
      <button class="mode-btn" data-mode="wail"><span class="icon">&#x223F;</span>WAIL</button>
      <button class="mode-btn" data-mode="alert"><span class="icon">&#x2A5A;</span>ALERT</button>
      <button class="mode-btn" data-mode="hilo"><span class="icon">&#x2195;</span>HI-LO</button>
      <button class="mode-btn" data-mode="attack"><span class="icon">&#x26A1;</span>ATTACK</button>
    </div>
  </div>

  <div class="control-group">
    <label>Horn Shape</label>
    <div class="mode-group" id="horn-shape-group">
      <button class="mode-btn" data-horn="narrow"><span class="icon">&#x25B2;</span>Narrow</button>
      <button class="mode-btn active" data-horn="wide"><span class="icon">&#x2312;</span>Wide</button>
      <button class="mode-btn" data-horn="rectangular"><span class="icon">&#x25AC;</span>Square</button>
      <button class="mode-btn" data-horn="none"><span class="icon">&#x25CB;</span>None</button>
    </div>

    <div class="control-group">
      <label>Rings</label>
      <div class="ring-controls" id="ring-controls"></div>
      <div style="margin-top:8px">
        <button class="btn-small" id="btn-add-ring">+ Add Ring</button>
      </div>
    </div>

    <div class="control-group" id="selected-ring-controls" style="display:none">
      <label>Selected Ring <span class="value-display" id="ring-freq-display"></span></label>
      <div style="margin-bottom:10px">
        <label style="font-size:13px">Holes: <span class="value-display" id="port-count-display">10</span></label>
        <input type="range" id="port-count-slider" min="4" max="16" value="10" step="1">
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:13px">Hole Size: <span class="value-display" id="duty-display">50%</span></label>

  downtown: { duration: 1.5, decay: 2, reverbSend: 0.35, filterMul: 1.0, tornado: false },

const PARTS = {
  motors: [
    { id: 'motor-small', label: 'Small', maxRPM: 3000, tauUp: 5 },
    { id: 'motor-medium', label: 'Medium', maxRPM: 5000, tauUp: 8 },
    { id: 'motor-large', label: 'Large', maxRPM: 8000, tauUp: 15 },
  ],

    { id: 'rotor-thick', label: 'Thick (Heavy)', tauDown: 15, portCount: 10 },
  ],
  horns: [
    { id: 'horn-narrow', label: 'Narrow Cone', freq: 900, Q: 5.0 },
    { id: 'horn-wide', label: 'Wide Bell', freq: 500, Q: 1.0 },
    { id: 'horn-square', label: 'Square', freq: 700, Q: 3.0 },
  ],
};

// ============================================================
// APP STATE
// ============================================================
const state = {
  rings: [
    { portCount: 10, portShape: 'rectangular', dutyCycle: 0.5, enabled: true },
    { portCount: 12, portShape: 'rectangular', dutyCycle: 0.5, enabled: true },
  ],
  motor: {
    maxRPM: 3450, mode: 'steady', running: false,
    tauUp: 8, tauDown: 12,
    wailPeriod: 10, wailMin: 0.4,
    alertPeriod: 7, alertDuty: 0.5,
    hiloPeriod: 3, attackPeriod: 6,
  },
  horn: { freq: 500, Q: 1.0, gain: 6, shape: 'wide' },
  volume: 0.7,
  selectedRing: 0,
  currentRPM: 0,
  activePreset: null,
  environment: { distance: 0, preset: 'outdoor' },
  appMode: 'tune',
  assembly: { motor: null, rotor: null, horn: null },
};

// ============================================================
// AUDIO WORKLET PROCESSOR (inlined as Blob URL)
// ============================================================
const workletCode = `
class SirenProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.rpm = 0;
    this.rotorAngle = 0;
    this.time = 0;
    this.running = false;
    this.rings = [];
    this.motor = {
      maxRPM: 3450, mode: 'steady',
      tauUp: 8, tauDown: 12,
      wailPeriod: 10, wailMin: 0.4,
      alertPeriod: 7, alertDuty: 0.5,
      hiloPeriod: 3, attackPeriod: 6,
    };
    this.volume = 0.7;
    this.telemetryCounter = 0;
    this.telemetryInterval = Math.floor(sampleRate * 0.05);
    // Hi-Lo state
    this.hiloTimer = 0;
    this.hiloState = 0;
    // Noise filter state
    this.noisePrev = 0;

    this.port.onmessage = (e) => {
      const msg = e.data;
      switch (msg.type) {
        case 'config':
          this.rings = msg.rings || [];
          break;
        case 'motor':
          if (msg.running !== undefined) this.running = msg.running;
          if (msg.maxRPM !== undefined) this.motor.maxRPM = msg.maxRPM;
          if (msg.mode !== undefined) this.motor.mode = msg.mode;
          if (msg.tauUp !== undefined) this.motor.tauUp = msg.tauUp;
          if (msg.tauDown !== undefined) this.motor.tauDown = msg.tauDown;
          if (msg.wailPeriod !== undefined) this.motor.wailPeriod = msg.wailPeriod;
          if (msg.wailMin !== undefined) this.motor.wailMin = msg.wailMin;
          if (msg.alertPeriod !== undefined) this.motor.alertPeriod = msg.alertPeriod;
          if (msg.alertDuty !== undefined) this.motor.alertDuty = msg.alertDuty;
          if (msg.hiloPeriod !== undefined) this.motor.hiloPeriod = msg.hiloPeriod;
          if (msg.attackPeriod !== undefined) this.motor.attackPeriod = msg.attackPeriod;
          break;
        case 'volume':
          this.volume = msg.level;
          break;
      }
    };
  }

  portOverlap(phase, dutyCycle) {
    // phase: 0-1 within one port period, dutyCycle: 0-1
    // Convolution of two rectangular pulses of width dutyCycle
    const w = dutyCycle;
    let d = phase % 1.0;
    if (d < 0) d += 1.0;
    if (d > 0.5) d -= 1.0;
    return Math.max(0, w - Math.abs(d)) / w;
  }

  portOverlapRound(phase, dutyCycle) {
    // Smooth cosine-based overlap for round ports
    let d = phase % 1.0;
    if (d < 0) d += 1.0;
    if (d > 0.5) d -= 1.0;
    const w = dutyCycle * 0.5;
    if (Math.abs(d) >= w) return 0;
    return 0.5 * (1 + Math.cos(Math.PI * d / w));
  }

  getTargetRPM() {
    if (!this.running) return 0;
    const m = this.motor;
    switch (m.mode) {
      case 'steady':
        return m.maxRPM;
      case 'wail': {
        const phase = (this.time % m.wailPeriod) / m.wailPeriod;
        const frac = m.wailMin + (1 - m.wailMin) * 0.5 * (1 - Math.cos(phase * 2 * Math.PI));
        return m.maxRPM * frac;
      }
      case 'alert': {
        const phase = (this.time % m.alertPeriod) / m.alertPeriod;
        return phase < m.alertDuty ? m.maxRPM : 0;
      }
      case 'hilo':
        return m.maxRPM;
      case 'attack': {
        const phase = (this.time % m.attackPeriod) / m.attackPeriod;
        if (phase < 0.3) return m.maxRPM;
        if (phase < 0.5) return m.maxRPM;
        return 0;
      }
      default:
        return m.maxRPM;
    }
  }

  process(inputs, outputs) {
    const output = outputs[0];
    const channel = output[0];
    if (!channel) return true;
    const dt = 1 / sampleRate;

    for (let i = 0; i < channel.length; i++) {
      this.time += dt;

      // Motor dynamics
      const target = this.getTargetRPM();
      if (target > this.rpm) {
        this.rpm += (target - this.rpm) * (1 - Math.exp(-dt / this.motor.tauUp));
      } else {
        this.rpm *= Math.exp(-dt / this.motor.tauDown);
        if (this.rpm < 0.5) this.rpm = 0;
      }

      // Advance rotor angle (keep within 0-2PI for float precision)
      const angularVel = this.rpm * 2 * Math.PI / 60;
      this.rotorAngle = (this.rotorAngle + angularVel * dt) % (2 * Math.PI);

      // Hi-Lo timer update (before ring loop)
      if (this.motor.mode === 'hilo' && this.rings.length >= 2) {
        this.hiloTimer += dt;
        if (this.hiloTimer >= this.motor.hiloPeriod) {
          this.hiloTimer = 0;
          this.hiloState = 1 - this.hiloState;
        }
      }

      // Sum ring contributions
      let sample = 0;
      let activeCount = 0;

      for (let r = 0; r < this.rings.length; r++) {
        const ring = this.rings[r];
        if (!ring.enabled) continue;
        // Hi-Lo: only play the active ring
        if (this.motor.mode === 'hilo' && this.rings.length >= 2 && r !== this.hiloState % this.rings.length) continue;
        activeCount++;

        const n = ring.portCount;
        const portPhase = ((n * this.rotorAngle) / (2 * Math.PI)) % 1.0;

        let openness;
        if (ring.portShape === 'round') {
          openness = this.portOverlapRound(portPhase, ring.dutyCycle);
        } else {
          openness = this.portOverlap(portPhase, ring.dutyCycle);
        }

        // Center around 0 for audio signal, weight by ring index
        const weight = 0.8 + 0.2 * (r / Math.max(1, this.rings.length - 1));
        sample += (openness - 0.5) * weight;
      }

      if (activeCount > 0) sample /= activeCount;

      // Amplitude envelope based on RPM
      const rpmFrac = this.rpm / Math.max(1, this.motor.maxRPM);
      const ampEnv = Math.pow(rpmFrac, 1.5);
      sample *= ampEnv;

      // Turbulence noise layer (subtle air whoosh, not audible fuzz)
      const noiseRaw = (Math.random() * 2 - 1) * 0.04 * Math.pow(rpmFrac, 2.0);
      this.noisePrev += 0.08 * (noiseRaw - this.noisePrev);
      sample += this.noisePrev;

      // Volume and soft clip
      sample *= this.volume;
      sample = Math.tanh(sample * 2.0);

      channel[i] = sample;
    }

    // Stereo: copy to other channels
    for (let c = 1; c < output.length; c++) {
      output[c].set(channel);
    }

    // Telemetry
    this.telemetryCounter += channel.length;
    if (this.telemetryCounter >= this.telemetryInterval) {
      this.port.postMessage({ type: 'telemetry', rpm: this.rpm });
      this.telemetryCounter = 0;
    }

    return true;
  }
}

registerProcessor('siren-processor', SirenProcessor);
`;

// ============================================================
// AUDIO ENGINE (main thread)
// ============================================================
let audioCtx = null;
let sirenNode = null;
let hornFilter = null;
let gainNode = null;
let analyser = null;
let audioReady = false;
let recordDest = null;
let mediaRecorder = null;
let recordedChunks = [];
let vizMode = 'wave';

// Ambient environment nodes
let distanceFilter = null;
let distanceGain = null;
let reverbSendGain = null;
let convolverNode = null;

// Tornado ambient noise nodes
let tornadoWindOsc = null;
let tornadoWindFilter = null;
let tornadoWindGain = null;
let tornadoNoiseSource = null;
let tornadoNoiseFilter = null;
let tornadoNoiseGain = null;
let tornadoNoiseBuffer = null;

function createImpulseResponse(duration, decay) {
  const len = audioCtx.sampleRate * duration;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

async function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);

    sirenNode = new AudioWorkletNode(audioCtx, 'siren-processor');

    // Horn resonance filter
    hornFilter = audioCtx.createBiquadFilter();
    hornFilter.type = 'peaking';
    hornFilter.frequency.value = state.horn.freq;
    hornFilter.Q.value = state.horn.Q;
    hornFilter.gain.value = state.horn.gain ?? 8;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 1.0;

    recordDest = audioCtx.createMediaStreamDestination();

    // Distance simulation: lowpass filter to muffle at distance
    distanceFilter = audioCtx.createBiquadFilter();
    distanceFilter.type = 'lowpass';
    distanceFilter.frequency.value = 20000;
    distanceFilter.Q.value = 0.7;

    // Distance gain: attenuate at distance
    distanceGain = audioCtx.createGain();
    distanceGain.gain.value = 1.0;

    // Reverb via convolver
    const envPreset = ENV_PRESETS[state.environment.preset] || ENV_PRESETS.outdoor;
    convolverNode = audioCtx.createConvolver();
    convolverNode.buffer = createImpulseResponse(envPreset.duration, envPreset.decay);

    reverbSendGain = audioCtx.createGain();
    reverbSendGain.gain.value = envPreset.reverbSend;

    // Chain: sirenNode → hornFilter → gainNode → distanceFilter → distanceGain → destination
    //        distanceGain → reverbSendGain → convolver → destination
    sirenNode.connect(hornFilter);
    hornFilter.connect(gainNode);
    gainNode.connect(distanceFilter);
    distanceFilter.connect(distanceGain);
    distanceGain.connect(audioCtx.destination);
    distanceGain.connect(recordDest);

    distanceGain.connect(reverbSendGain);
    reverbSendGain.connect(convolverNode);
    convolverNode.connect(audioCtx.destination);

    // Analyser for waveform/spectrum visualizer
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    gainNode.connect(analyser);

    sirenNode.port.onmessage = (e) => {
      if (e.data.type === 'telemetry') {
        state.currentRPM = e.data.rpm;
      }
    };

    sendConfig();
    sendMotor();
    sendVolume();

    audioReady = true;
    document.getElementById('btn-record').disabled = false;
  } catch (err) {
    const banner = document.getElementById('error-banner');
    banner.textContent = 'Could not start audio engine. Try using Chrome or Firefox!';
    banner.classList.add('show');
    console.error('Audio init failed:', err);
  }
}

function sendConfig() {
  if (!sirenNode) return;
  sirenNode.port.postMessage({
    type: 'config',
    rings: state.rings.map(r => ({
      portCount: r.portCount,
      portShape: r.portShape,
      dutyCycle: r.dutyCycle,
      enabled: r.enabled,
    })),
  });
}

function sendMotor() {
  if (!sirenNode) return;
  sirenNode.port.postMessage({
    type: 'motor',
    running: state.motor.running,
    maxRPM: state.motor.maxRPM,
    mode: state.motor.mode,
    tauUp: state.motor.tauUp,
    tauDown: state.motor.tauDown,
    wailPeriod: state.motor.wailPeriod,
    wailMin: state.motor.wailMin,
    alertPeriod: state.motor.alertPeriod,
    alertDuty: state.motor.alertDuty,
    hiloPeriod: state.motor.hiloPeriod,
    attackPeriod: state.motor.attackPeriod,
  });
}

function sendVolume() {
  if (!sirenNode) return;
  sirenNode.port.postMessage({ type: 'volume', level: state.volume });
}

function updateHornFilter() {
  if (!hornFilter) return;
  hornFilter.frequency.value = state.horn.freq;
  hornFilter.Q.value = state.horn.Q;
  hornFilter.gain.value = state.horn.gain ?? 8;
}

function updateDistance(d) {
  if (!distanceFilter || !distanceGain || !reverbSendGain) return;
  const envPreset = ENV_PRESETS[state.environment.preset] || ENV_PRESETS.outdoor;
  const filterMul = envPreset.filterMul;
  // Exponential mapping: close = full freq/volume, far = muffled/quiet
  distanceFilter.frequency.value = 20000 * Math.pow(800 / 20000, d) * filterMul;
  distanceGain.gain.value = 1.0 * Math.pow(0.15, d);
  reverbSendGain.gain.value = envPreset.reverbSend + d * 0.4;
}

function applyEnvironmentPreset(presetKey) {
  const envPreset = ENV_PRESETS[presetKey];
  if (!envPreset) return;
  state.environment.preset = presetKey;

  // Rebuild convolver IR for the new environment
  if (convolverNode && audioCtx) {
    convolverNode.buffer = createImpulseResponse(envPreset.duration, envPreset.decay);
  }

  // Re-apply distance with new preset parameters
  updateDistance(state.environment.distance);

  // Handle tornado ambient noise
  if (envPreset.tornado) {
    startTornadoNoise();
  } else {
    stopTornadoNoise();
  }
}

function startTornadoNoise() {
  if (!audioCtx || tornadoWindOsc) return;

  // Wind: low-frequency oscillator through a lowpass filter
  tornadoWindOsc = audioCtx.createOscillator();
  tornadoWindOsc.type = 'sawtooth';
  tornadoWindOsc.frequency.value = 60;

  tornadoWindFilter = audioCtx.createBiquadFilter();
  tornadoWindFilter.type = 'lowpass';
  tornadoWindFilter.frequency.value = 400;
  tornadoWindFilter.Q.value = 1.0;

  tornadoWindGain = audioCtx.createGain();
  tornadoWindGain.gain.value = 0.06;

  tornadoWindOsc.connect(tornadoWindFilter);
  tornadoWindFilter.connect(tornadoWindGain);
  tornadoWindGain.connect(audioCtx.destination);
  tornadoWindOsc.start();

  // Rain: filtered white noise
  const noiseDuration = 4;
  const noiseLen = audioCtx.sampleRate * noiseDuration;
  tornadoNoiseBuffer = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
  const noiseData = tornadoNoiseBuffer.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) noiseData[i] = Math.random() * 2 - 1;

  tornadoNoiseSource = audioCtx.createBufferSource();
  tornadoNoiseSource.buffer = tornadoNoiseBuffer;
  tornadoNoiseSource.loop = true;

  tornadoNoiseFilter = audioCtx.createBiquadFilter();
  tornadoNoiseFilter.type = 'bandpass';
  tornadoNoiseFilter.frequency.value = 3000;
  tornadoNoiseFilter.Q.value = 0.5;

  tornadoNoiseGain = audioCtx.createGain();
  tornadoNoiseGain.gain.value = 0.04;

  tornadoNoiseSource.connect(tornadoNoiseFilter);
  tornadoNoiseFilter.connect(tornadoNoiseGain);
  tornadoNoiseGain.connect(audioCtx.destination);
  tornadoNoiseSource.start();
}

function stopTornadoNoise() {
  if (tornadoWindOsc) {
    try { tornadoWindOsc.stop(); } catch (e) {}
    tornadoWindOsc.disconnect();
    tornadoWindFilter.disconnect();
    tornadoWindGain.disconnect();
    tornadoWindOsc = null;
    tornadoWindFilter = null;
    tornadoWindGain = null;
  }
  if (tornadoNoiseSource) {
    try { tornadoNoiseSource.stop(); } catch (e) {}
    tornadoNoiseSource.disconnect();
    tornadoNoiseFilter.disconnect();
    tornadoNoiseGain.disconnect();
    tornadoNoiseSource = null;
    tornadoNoiseFilter = null;
    tornadoNoiseGain = null;
    tornadoNoiseBuffer = null;
  }
}

// ============================================================
// CANVAS - ROTOR EDITOR
// ============================================================
const canvas = document.getElementById('rotor-canvas');
const ctx = canvas.getContext('2d');
let animAngle = 0;
let lastAnimTime = 0;

// Sound wave animation state
let soundWaves = [];
let lastWaveSpawn = 0;
let nextColorIndex = 0;

function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// --- Waveform / Spectrum visualizer ---
const wfCanvas = document.getElementById('waveform-canvas');
const wfCtx = wfCanvas.getContext('2d');

function setupWaveformCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = wfCanvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  wfCanvas.width = w * dpr;
  wfCanvas.height = h * dpr;
  wfCanvas.style.width = w + 'px';
  wfCanvas.style.height = h + 'px';
  wfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawWaveform() {
  if (!analyser) return;

  const rect = wfCanvas.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  wfCtx.clearRect(0, 0, W, H);

  if (vizMode === 'wave') {
    // --- Waveform (oscilloscope) mode ---
    const bufLen = analyser.frequencyBinCount;
    const data = new Uint8Array(bufLen);
    analyser.getByteTimeDomainData(data);

    wfCtx.lineWidth = 2;
    wfCtx.strokeStyle = '#4ECDC4'; // cyan/green
    wfCtx.beginPath();

    const sliceW = W / bufLen;
    let x = 0;
    for (let i = 0; i < bufLen; i++) {
      const v = data[i] / 128.0; // 0-2 range, 1 = center
      const y = (v * H) / 2;
      if (i === 0) {
        wfCtx.moveTo(x, y);
      } else {
        wfCtx.lineTo(x, y);
      }
      x += sliceW;
    }
    wfCtx.lineTo(W, H / 2);
    wfCtx.stroke();

    // Draw center line (dim)
    wfCtx.strokeStyle = 'rgba(255,255,255,0.08)';
    wfCtx.lineWidth = 1;
    wfCtx.beginPath();
    wfCtx.moveTo(0, H / 2);
    wfCtx.lineTo(W, H / 2);
    wfCtx.stroke();
  } else {
    // --- Frequency spectrum (bar graph) mode ---
    const bufLen = analyser.frequencyBinCount;
    const data = new Uint8Array(bufLen);
    analyser.getByteFrequencyData(data);

    // Use a subset of bins for visual clarity (lower frequencies are more interesting)
    const barCount = Math.min(64, bufLen);
    const barW = W / barCount;

    for (let i = 0; i < barCount; i++) {
      // Map bar index to frequency bin (logarithmic-ish spread for lower frequencies)
      const binIndex = Math.floor((i / barCount) * bufLen * 0.5);
      const val = data[binIndex] / 255;
      const barH = val * H;

      // Cycle through RING_COLORS for the bars
      const color = RING_COLORS[i % RING_COLORS.length];

      wfCtx.fillStyle = color;
      wfCtx.globalAlpha = 0.6 + val * 0.4;
      wfCtx.fillRect(i * barW + 1, H - barH, barW - 2, barH);
    }
    wfCtx.globalAlpha = 1.0;
  }
}

// Stored layout rects for click detection
let ringBands = [];

function drawSiren(time) {
  if (!lastAnimTime) lastAnimTime = time;
  const dt = (time - lastAnimTime) / 1000;
  lastAnimTime = time;

  const angularVel = state.currentRPM * 2 * Math.PI / 60;
  animAngle += angularVel * dt;

  const rect = canvas.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  const pad = 16;
  const innerW = W - pad * 2;
  const rpmFrac = state.currentRPM / Math.max(1, state.motor.maxRPM);
  const isRunning = state.motor.running && state.currentRPM > 1;
  const ringsCount = Math.max(1, state.rings.length);
  const fontFamily = getComputedStyle(document.body).fontFamily;

  ctx.clearRect(0, 0, W, H);

  // === LAYOUT ===
  const hornH = H * 0.11;
  const motorH = H * 0.13;
  const shaftH = H * 0.08;
  const statorCapH = 6;
  const basePlateH = 6;
  const ringAreaH = H - hornH - statorCapH - basePlateH - shaftH - motorH - pad * 2;
  const ringTotalH = ringAreaH / ringsCount;
  const statorRowH = ringTotalH * 0.35;
  const rotorRowH = ringTotalH * 0.35;
  const ringGapH = ringTotalH * 0.3;

  let y = pad;

  // === SOUND WAVES (drawn before horn so they appear behind it) ===
  {
    // Determine active rings and compute average frequency
    const activeRings = state.rings
      .map((r, i) => ({ ring: r, index: i }))
      .filter(r => r.ring.enabled);

    if (isRunning && activeRings.length > 0) {
      const avgFreq = activeRings.reduce((sum, r) => sum + r.ring.portCount * state.currentRPM / 60, 0) / activeRings.length;

      // Spawn new waves at a rate proportional to frequency
      // Use a multiplier so waves don't spawn too rapidly
      const spawnInterval = 1000 / (avgFreq * 0.15);
      if (time - lastWaveSpawn > spawnInterval) {
        const colorIdx = activeRings[nextColorIndex % activeRings.length].index;
        soundWaves.push({ age: 0, maxAge: 1.0, colorIndex: colorIdx });
        nextColorIndex++;
        lastWaveSpawn = time;
      }
    }

    // Update wave ages and remove expired ones
    for (let i = soundWaves.length - 1; i >= 0; i--) {
      soundWaves[i].age += dt;
      if (soundWaves[i].age > soundWaves[i].maxAge) {
        soundWaves.splice(i, 1);
      }
    }

    // Clear waves when siren stops
    if (!isRunning && soundWaves.length > 0) {
      // Let existing waves fade out naturally (they'll be removed above)
    }

    // Draw sound waves as arcs emanating from horn mouth
    const waveCx = W / 2;
    const waveCy = pad + 3;
    const maxRadius = 75;

    ctx.save();
    // Clip to upper region so waves don't paint over the siren body
    ctx.beginPath();
    ctx.rect(0, 0, W, pad + 6);
    ctx.clip();

    for (const wave of soundWaves) {
      const progress = wave.age / wave.maxAge;
      const radius = progress * maxRadius;
      const alpha = (1 - progress) * rpmFrac;
      const color = RING_COLORS[wave.colorIndex % RING_COLORS.length];
      const lw = 2 + rpmFrac * 3;

      if (alpha <= 0) continue;

      ctx.beginPath();
      ctx.arc(waveCx, waveCy, radius, Math.PI, 0);
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = lw;
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // === HORN (shape-dependent) ===
  const hornShape = state.horn.shape || 'wide';

  if (hornShape !== 'none') {
    let hornTopW, hornBotW;

    if (hornShape === 'narrow') {
      hornTopW = innerW * 0.5;
      hornBotW = innerW * 0.35;
    } else if (hornShape === 'wide') {
      hornTopW = innerW * 0.95;
      hornBotW = innerW * 0.3;
    } else if (hornShape === 'rectangular') {
      hornTopW = innerW * 0.6;
      hornBotW = innerW * 0.6;
    } else {
      hornTopW = innerW * 0.9;
      hornBotW = innerW * 0.45;
    }

    const hornGrad = ctx.createLinearGradient(0, y, 0, y + hornH);
    hornGrad.addColorStop(0, '#8B7355');
    hornGrad.addColorStop(0.5, '#A08060');
    hornGrad.addColorStop(1, '#6B5540');

    ctx.beginPath();
    if (hornShape === 'wide') {
      // Flared bell with slight curve
      const lTop = pad + (innerW - hornTopW) / 2;
      const rTop = pad + (innerW + hornTopW) / 2;
      const lBot = pad + (innerW - hornBotW) / 2;
      const rBot = pad + (innerW + hornBotW) / 2;
      ctx.moveTo(lTop, y);
      ctx.lineTo(rTop, y);
      ctx.quadraticCurveTo(rBot + (rTop - rBot) * 0.3, y + hornH * 0.7, rBot, y + hornH);
      ctx.lineTo(lBot, y + hornH);
      ctx.quadraticCurveTo(lBot - (lBot - lTop) * 0.3, y + hornH * 0.7, lTop, y);
    } else {
      // Straight-sided trapezoid (narrow, rectangular, or fallback)
      ctx.moveTo(pad + (innerW - hornTopW) / 2, y);
      ctx.lineTo(pad + (innerW + hornTopW) / 2, y);
      ctx.lineTo(pad + (innerW + hornBotW) / 2, y + hornH);
      ctx.lineTo(pad + (innerW - hornBotW) / 2, y + hornH);
    }
    ctx.closePath();
    ctx.fillStyle = hornGrad;
    ctx.fill();
    ctx.strokeStyle = '#9B8365';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Horn opening (dark inside)
    const openW = hornTopW * 0.75;
    const openBotW = hornBotW * 0.5;
    ctx.beginPath();
    if (hornShape === 'wide') {
      const lTop = pad + (innerW - openW) / 2;
      const rTop = pad + (innerW + openW) / 2;
      const lBot = pad + (innerW - openBotW) / 2;
      const rBot = pad + (innerW + openBotW) / 2;
      ctx.moveTo(lTop, y + 3);
      ctx.lineTo(rTop, y + 3);
      ctx.quadraticCurveTo(rBot + (rTop - rBot) * 0.3, y + hornH * 0.65, rBot, y + hornH - 2);
      ctx.lineTo(lBot, y + hornH - 2);
      ctx.quadraticCurveTo(lBot - (lBot - lTop) * 0.3, y + hornH * 0.65, lTop, y + 3);
    } else {
      ctx.moveTo(pad + (innerW - openW) / 2, y + 3);
      ctx.lineTo(pad + (innerW + openW) / 2, y + 3);
      ctx.lineTo(pad + (innerW + openBotW) / 2, y + hornH - 2);
      ctx.lineTo(pad + (innerW - openBotW) / 2, y + hornH - 2);
    }
    ctx.closePath();
    ctx.fillStyle = '#1a1210';
    ctx.fill();

    // Label
    const shapeLabel = HORN_SHAPES[hornShape] ? HORN_SHAPES[hornShape].label : 'HORN';
    ctx.fillStyle = '#c0a080';
    ctx.font = `bold 10px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.fillText(shapeLabel.toUpperCase(), W / 2, y + hornH - 8);
  }

  y += hornH;

  // === STATOR CAP (thin plate connecting horn to assembly) ===
  ctx.fillStyle = '#3a3a4a';
  ctx.fillRect(pad, y, innerW, statorCapH);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(pad, y, innerW, statorCapH);
  y += statorCapH;

  // === PORT ASSEMBLY (stator + rotor bands per ring) ===
  ringBands = [];
  const assemblyX = pad;
  const assemblyW = innerW;

  for (let i = 0; i < state.rings.length; i++) {
    const ring = state.rings[i];
    const color = RING_COLORS[i % RING_COLORS.length];
    const bandY = y + i * ringTotalH;
    const gapBefore = ringGapH * 0.15;

    // Store for click detection
    ringBands.push({ y: bandY, h: ringTotalH, index: i });

    // Selected highlight background
    if (i === state.selectedRing) {
      ctx.fillStyle = color + '15';
      ctx.fillRect(assemblyX, bandY, assemblyW, statorRowH + rotorRowH + gapBefore * 2);
      ctx.strokeStyle = color + '60';
      ctx.lineWidth = 2;
      ctx.strokeRect(assemblyX, bandY, assemblyW, statorRowH + rotorRowH + gapBefore * 2);
    }

    // --- STATOR ROW (fixed ports) ---
    const statorY = bandY + gapBefore;
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(assemblyX, statorY, assemblyW, statorRowH);

    // Draw stator port pattern (fixed)
    if (ring.enabled) {
      drawPortBand(ctx, assemblyX, statorY, assemblyW, statorRowH,
        ring.portCount, ring.dutyCycle, ring.portShape, 0, '#4a4a6a', color + '30');
    }

    // Stator label
    ctx.fillStyle = '#666';
    ctx.font = `9px ${fontFamily}`;
    ctx.textAlign = 'left';
    ctx.fillText('STATOR', assemblyX + 4, statorY + statorRowH - 3);

    // --- ROTOR ROW (scrolling ports) ---
    const rotorY = statorY + statorRowH + 2;
    ctx.fillStyle = '#1e1e2e';
    ctx.fillRect(assemblyX, rotorY, assemblyW, rotorRowH);

    if (ring.enabled) {
      const scrollOffset = (animAngle / (2 * Math.PI)) * assemblyW;
      drawPortBand(ctx, assemblyX, rotorY, assemblyW, rotorRowH,
        ring.portCount, ring.dutyCycle, ring.portShape, scrollOffset, '#1e1e2e', color);

      // Glow on rotor when running
      if (isRunning) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 4 + rpmFrac * 8;
        ctx.strokeStyle = color + '60';
        ctx.lineWidth = 1;
        ctx.strokeRect(assemblyX, rotorY, assemblyW, rotorRowH);
        ctx.restore();
      }
    }

    // Rotor label
    ctx.fillStyle = '#888';
    ctx.font = `9px ${fontFamily}`;
    ctx.textAlign = 'left';
    ctx.fillText('ROTOR', assemblyX + 4, rotorY + rotorRowH - 3);

    // Ring number + port count label on right
    ctx.fillStyle = color;
    ctx.font = `bold 11px ${fontFamily}`;
    ctx.textAlign = 'right';
    ctx.fillText(`Ring ${i + 1}: ${ring.portCount} ports`, assemblyX + assemblyW - 4, statorY + statorRowH / 2 + 4);

    // Air flow indicators between stator and rotor
    if (ring.enabled && isRunning) {
      drawAirFlow(ctx, assemblyX, statorY, assemblyW, statorRowH, rotorRowH,
        ring.portCount, ring.dutyCycle, animAngle, color, rpmFrac);
    }

    // Divider between rings
    if (i < state.rings.length - 1) {
      const divY = bandY + statorRowH + rotorRowH + gapBefore * 2 + ringGapH * 0.3;
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(assemblyX + 10, divY);
      ctx.lineTo(assemblyX + assemblyW - 10, divY);
      ctx.stroke();
    }
  }

  y += ringAreaH;

  // === BASE PLATE ===
  ctx.fillStyle = '#3a3a4a';
  ctx.fillRect(pad, y, innerW, basePlateH);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(pad, y, innerW, basePlateH);
  y += basePlateH;

  // === SHAFT ===
  const shaftW = 14;
  const shaftX = W / 2 - shaftW / 2;
  const shaftGrad = ctx.createLinearGradient(shaftX, 0, shaftX + shaftW, 0);
  shaftGrad.addColorStop(0, '#555');
  shaftGrad.addColorStop(0.5, '#888');
  shaftGrad.addColorStop(1, '#555');
  ctx.fillStyle = shaftGrad;
  ctx.fillRect(shaftX, y, shaftW, shaftH);
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.strokeRect(shaftX, y, shaftW, shaftH);
  y += shaftH;

  // === MOTOR ===
  const motorW = innerW * 0.55;
  const motorX = pad + (innerW - motorW) / 2;
  const motorGrad = ctx.createLinearGradient(0, y, 0, y + motorH);
  motorGrad.addColorStop(0, '#3a3a4a');
  motorGrad.addColorStop(0.5, '#2e2e3e');
  motorGrad.addColorStop(1, '#252535');
  ctx.fillStyle = motorGrad;
  roundRect(ctx, motorX, y, motorW, motorH, 6);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  roundRect(ctx, motorX, y, motorW, motorH, 6);
  ctx.stroke();

  // Motor spinning indicator
  const motorCx = W / 2;
  const motorCy = y + motorH / 2;
  const motorR = Math.min(motorW, motorH) * 0.25;
  ctx.strokeStyle = isRunning ? '#FF9800' : '#444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(motorCx, motorCy, motorR, 0, Math.PI * 2);
  ctx.stroke();

  // Spinning spokes
  const spokeCount = 4;
  for (let s = 0; s < spokeCount; s++) {
    const angle = (s / spokeCount) * Math.PI * 2 + (isRunning ? animAngle * 0.5 : 0);
    ctx.beginPath();
    ctx.moveTo(motorCx, motorCy);
    ctx.lineTo(motorCx + motorR * Math.cos(angle), motorCy + motorR * Math.sin(angle));
    ctx.strokeStyle = isRunning ? '#FF9800' : '#444';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Motor label
  ctx.fillStyle = '#888';
  ctx.font = `bold 10px ${fontFamily}`;
  ctx.textAlign = 'center';
  ctx.fillText('MOTOR', motorCx, y + motorH - 6);

  // === RPM bar ===
  const rpmBar = document.getElementById('rpm-bar');
  const rpmLabel = document.getElementById('rpm-label');
  rpmBar.style.width = Math.min(100, rpmFrac * 100) + '%';
  rpmLabel.textContent = Math.round(state.currentRPM) + ' RPM';

  // === Live frequency display ===
  const freqDisplay = document.getElementById('freq-display');
  let freqHTML = '';
  for (let i = 0; i < state.rings.length; i++) {
    const ring = state.rings[i];
    if (!ring.enabled) continue;
    const freq = Math.round(ring.portCount * state.currentRPM / 60);
    const color = RING_COLORS[i % RING_COLORS.length];
    freqHTML += `<span class="freq-chip" style="background:${color}55;border:1px solid ${color}">${freq} Hz</span>`;
  }
  freqDisplay.innerHTML = freqHTML;

  // Draw waveform/spectrum visualizer
  drawWaveform();

  requestAnimationFrame(drawSiren);
}

function drawPortBand(ctx, x, y, w, h, portCount, dutyCycle, shape, scrollOffset, bgColor, portColor) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();

  const period = w / portCount;
  const portW = period * dutyCycle;
  const startOffset = -(scrollOffset % period) - period;

  for (let px = startOffset; px < w + period; px += period) {
    const drawX = x + px;
    const drawW = portW;

    if (shape === 'round') {
      const cx = drawX + drawW / 2;
      const cy = y + h / 2;
      const r = Math.min(drawW, h - 4) / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = portColor;
      ctx.fill();
    } else {
      ctx.fillStyle = portColor;
      ctx.fillRect(drawX + 1, y + 2, drawW - 2, h - 4);
    }
  }

  ctx.restore();
}

function drawAirFlow(ctx, x, statorY, w, statorH, rotorH, portCount, dutyCycle, angle, color, rpmFrac) {
  if (rpmFrac < 0.05) return;
  const period = w / portCount;
  const portW = period * dutyCycle;
  const rotorOffset = (angle / (2 * Math.PI)) * w;
  const flowY = statorY + statorH;
  const flowH = 2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(x, flowY, w, flowH);
  ctx.clip();
  ctx.globalAlpha = rpmFrac * 0.6;

  for (let i = 0; i < portCount * 2; i++) {
    const statorPortX = i * period;
    const rotorPortX = (i * period + rotorOffset) % (w + period);

    // Check approximate alignment
    const statorCenter = statorPortX + portW / 2;
    const rotorCenter = rotorPortX + portW / 2;
    for (let rp = -w; rp <= w; rp += w) {
      const diff = Math.abs(statorCenter - (rotorCenter + rp));
      if (diff < portW * 0.7) {
        const fx = x + statorPortX;
        ctx.fillStyle = color;
        ctx.fillRect(fx, flowY, portW, flowH);
        break;
      }
    }
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Canvas click → select ring by clicking on its band
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickY = e.clientY - rect.top;

  for (const band of ringBands) {
    if (clickY >= band.y && clickY <= band.y + band.h) {
      state.selectedRing = band.index;
      updateRingUI();
      return;
    }
  }
});

function updateRingUI() {
  const container = document.getElementById('ring-controls');
  container.innerHTML = '';

  state.rings.forEach((ring, i) => {
    const color = RING_COLORS[i % RING_COLORS.length];
    const div = document.createElement('div');
    div.className = 'ring-item' + (i === state.selectedRing ? ' selected' : '') + (!ring.enabled ? ' disabled' : '');
    div.style.borderLeftColor = color;
    div.innerHTML = `
      <div class="ring-header">
        <span><span class="ring-badge" style="background:${color}"></span>
        Ring ${i + 1}: ${ring.portCount} holes</span>
        <div class="ring-actions">
          <button class="btn-small" data-toggle="${i}">${ring.enabled ? 'ON' : 'OFF'}</button>
          ${state.rings.length > 1 ? `<button class="btn-small danger" data-remove="${i}">X</button>` : ''}
        </div>

    div.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      state.selectedRing = i;
      updateRingUI();
    });
    container.appendChild(div);
  });

  // Toggle/remove handlers
  container.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.toggle);
      state.rings[idx].enabled = !state.rings[idx].enabled;
      sendConfig();
      updateRingUI();
      state.activePreset = null;
      updatePresetUI();
    });
  });
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.remove);
      state.rings.splice(idx, 1);
      if (state.selectedRing >= state.rings.length) state.selectedRing = state.rings.length - 1;
      sendConfig();
      updateRingUI();
      state.activePreset = null;
      updatePresetUI();
    });
  });

  // Update selected ring controls
  const selControls = document.getElementById('selected-ring-controls');
  if (state.rings.length > 0 && state.selectedRing < state.rings.length) {
    selControls.style.display = '';
    const ring = state.rings[state.selectedRing];
    document.getElementById('port-count-slider').value = ring.portCount;
    document.getElementById('port-count-display').textContent = ring.portCount;
    document.getElementById('duty-slider').value = Math.round(ring.dutyCycle * 100);
    document.getElementById('duty-display').textContent = Math.round(ring.dutyCycle * 100) + '%';
    document.querySelectorAll('.shape-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.shape === ring.portShape);

    const freq = ring.portCount * state.motor.maxRPM / 60;
    document.getElementById('ring-freq-display').textContent = Math.round(freq) + ' Hz';
  } else {
    selControls.style.display = 'none';
  }

  // Add ring button
  document.getElementById('btn-add-ring').style.display =
    state.rings.length >= MAX_RINGS ? 'none' : '';
}

// --- Presets ---
function loadPreset(key) {
  const preset = PRESETS[key];
  if (!preset) return;

  state.rings = preset.rings.map(r => ({ ...r }));
  Object.assign(state.motor, preset.motor);
  state.motor.running = state.motor.running; // keep current running state
  state.horn = { ...preset.horn };
  state.volume = preset.volume;
  state.selectedRing = 0;
  state.activePreset = key;

  sendConfig();
  sendMotor();
  sendVolume();
  updateHornFilter();
  syncUIFromState();
}

function syncUIFromState() {
  speedSlider.value = state.motor.maxRPM;
  speedDisplay.textContent = state.motor.maxRPM + ' RPM';

  document.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.motor.mode);
  });

  volumeSlider.value = Math.round(state.volume * 100);
  volumeDisplay.textContent = Math.round(state.volume * 100) + '%';

  // Power slider: reverse the tauUp mapping
  const powerPct = Math.round((1 - (state.motor.tauUp - 1) / 19) * 100);
  powerSlider.value = Math.max(10, Math.min(100, powerPct));
  powerDisplay.textContent = powerSlider.value + '%';

  // Weight slider: reverse the tauDown mapping
  const weightPct = Math.round(((state.motor.tauDown - 2) / 28) * 100);
  weightSlider.value = Math.max(10, Math.min(100, weightPct));
  weightDisplay.textContent = weightSlider.value + '%';

  wailSlider.value = state.motor.wailPeriod;
  wailDisplay.textContent = state.motor.wailPeriod + 's';

  document.getElementById('wail-speed-group').style.display =
    state.motor.mode === 'wail' ? '' : 'none';

  // Horn shape buttons
  document.querySelectorAll('[data-horn]').forEach(b => {
    b.classList.toggle('active', b.dataset.horn === (state.horn.shape || 'wide'));
  });

  btnStart.textContent = state.motor.running ? 'STOP' : 'START';
  btnStart.classList.toggle('running', state.motor.running);

  // Environment controls
  distanceSlider.value = Math.round(state.environment.distance * 100);
  distanceDisplay.textContent = Math.round(state.environment.distance * 100) + '%';
  document.querySelectorAll('.env-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.env === state.environment.preset);
  });

  updateRingUI();
  updatePresetUI();
}

// --- Save/Load ---
function getSaves() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}

function saveSiren(name) {
  const saves = getSaves();
  saves.push({
    version: 1,
    name: name,
    timestamp: Date.now(),
    state: {
      rings: state.rings.map(r => ({ ...r })),
      motor: { ...state.motor },
      horn: { ...state.horn },
      volume: state.volume,
      environment: { ...state.environment },
    },
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saves));
}

function loadSiren(index) {
  const saves = getSaves();
  if (index < 0 || index >= saves.length) return;
  const save = saves[index];
  state.rings = save.state.rings.map(r => ({ ...r }));
  Object.assign(state.motor, save.state.motor);
  state.horn = { ...save.state.horn };
  state.volume = save.state.volume;
  if (save.state.environment) {
    state.environment = { ...save.state.environment };
  } else {
    state.environment = { distance: 0, preset: 'outdoor' };
  }
  state.selectedRing = 0;
  state.activePreset = null;

  sendConfig();
  sendMotor();
  sendVolume();
  updateHornFilter();
  applyEnvironmentPreset(state.environment.preset);
  syncUIFromState();
}

function deleteSiren(index) {
  const saves = getSaves();
  saves.splice(index, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saves));
}

// --- Recording ---
const btnRecord = document.getElementById('btn-record');
btnRecord.addEventListener('click', () => {
  if (!audioReady || !recordDest) return;

  if (mediaRecorder && mediaRecorder.state === 'recording') {
    // Stop recording
    mediaRecorder.stop();
    return;
  }

  // Start recording
  recordedChunks = [];
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
  const options = mimeType ? { mimeType } : {};

  try {
    mediaRecorder = new MediaRecorder(recordDest.stream, options);
  } catch (err) {
    console.error('MediaRecorder init failed:', err);
    return;
  }

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const ext = (mediaRecorder.mimeType || '').includes('webm') ? 'webm' : 'ogg';
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const timestamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    a.download = `Siren-Recording-${timestamp}.${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    btnRecord.textContent = 'Record';
    btnRecord.classList.remove('recording');
    mediaRecorder = null;
    recordedChunks = [];
  };

  mediaRecorder.start();
  btnRecord.textContent = 'Stop Rec';
  btnRecord.classList.add('recording');
});

// --- URL sharing ---
function encodeStateToHash() {
  const data = {
    v: 1,
    r: state.rings,
    m: state.motor,
    h: state.horn,
    vol: state.volume,
    env: state.environment,
  };
  return '#config=' + btoa(JSON.stringify(data));
}

function loadFromHash() {
  const hash = window.location.hash;
  if (!hash.startsWith('#config=')) return false;
  try {
    const data = JSON.parse(atob(hash.slice(8)));
    if (data.v !== 1) return false;
    state.rings = data.r.map(r => ({ ...r }));
    Object.assign(state.motor, data.m);
    state.motor.running = false;
    state.horn = { ...data.h };
    state.volume = data.vol;
    if (data.env) {
      state.environment = { ...data.env };
    } else {
      state.environment = { distance: 0, preset: 'outdoor' };
    }
    state.selectedRing = 0;
    state.activePreset = null;
    return true;
  } catch { return false; }
}

document.getElementById('btn-share').addEventListener('click', () => {
  const hash = encodeStateToHash();
  const url = window.location.origin + window.location.pathname + hash;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btn-share');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Link'; }, 2000);
  }).catch(() => {

});

// KEYBOARD SHORTCUTS
// ============================================================
const PRESET_KEYS = Object.keys(PRESETS); // ['thunderbolt', 'city', 'airraid', 'simple']

document.addEventListener('keydown', (e) => {
  // Don't fire shortcuts while the tap overlay is showing
  if (!document.getElementById('tap-overlay').classList.contains('hidden')) return;

  // Don't fire shortcuts while a modal is open
  if (document.querySelector('.modal-overlay.open')) return;

  // Don't fire shortcuts when focus is in a text input
  const tag = document.activeElement?.tagName?.toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  const key = e.key;

  // Space — Start/Stop toggle
  if (key === ' ') {
    e.preventDefault();
    btnStart.click();
    return;
  }

  // 1/2/3 — Switch mode (Steady/Wail/Alert)
  const modeMap = { '1': 'steady', '2': 'wail', '3': 'alert' };
  if (modeMap[key]) {
    const modeBtn = document.querySelector(`.mode-btn[data-mode="${modeMap[key]}"]`);
    if (modeBtn) modeBtn.click();
    return;
  }

  // Up/Down arrows — Adjust speed (RPM)
  if (key === 'ArrowUp' || key === 'ArrowDown') {
    e.preventDefault();
    const step = parseInt(speedSlider.step) || 50;
    const min = parseInt(speedSlider.min);
    const max = parseInt(speedSlider.max);
    let val = parseInt(speedSlider.value);
    if (key === 'ArrowUp') {
      val = Math.min(max, val + step);
    } else {
      val = Math.max(min, val - step);
    }
    speedSlider.value = val;
    speedSlider.dispatchEvent(new Event('input'));
    return;
  }

  // [ / ] — Cycle through presets
  if (key === '[' || key === ']') {
    let currentIndex = state.activePreset ? PRESET_KEYS.indexOf(state.activePreset) : -1;
    if (key === ']') {
      currentIndex = (currentIndex + 1) % PRESET_KEYS.length;
    } else {
      currentIndex = (currentIndex - 1 + PRESET_KEYS.length) % PRESET_KEYS.length;
    }
    loadPreset(PRESET_KEYS[currentIndex]);
    return;
  }

  // S — Save
  if (key === 's' || key === 'S') {
    document.getElementById('btn-save').click();
    return;
  }

  // L — Load
  if (key === 'l' || key === 'L') {
    document.getElementById('btn-load').click();
    return;
  }
});

const tunePanel = document.getElementById('tune-panel');
const buildPanel = document.getElementById('build-panel');

// --- Mode toggle ---
document.querySelectorAll('.mode-toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const newMode = btn.dataset.appmode;
    if (newMode === state.appMode) return;
    document.querySelectorAll('.mode-toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switchMode(newMode);
  });
});

function switchMode(newMode) {
  const oldMode = state.appMode;
  state.appMode = newMode;

  if (newMode === 'build') {
    // Sync state to assembly (best-effort)
    syncStateToAssembly();
    tunePanel.style.display = 'none';
    buildPanel.style.display = '';
    renderBuildPanel();
  } else {
    // Sync assembly to state
    syncAssemblyToState();
    buildPanel.style.display = 'none';
    tunePanel.style.display = '';
    syncUIFromState();
  }
}

function syncStateToAssembly() {
  // Motor: match by maxRPM
  const bestMotor = PARTS.motors.reduce((best, m) =>
    Math.abs(m.maxRPM - state.motor.maxRPM) < Math.abs(best.maxRPM - state.motor.maxRPM) ? m : best
  );
  state.assembly.motor = { ...bestMotor };

  // Rotor: match by first ring's portCount
  if (state.rings.length > 0) {
    const bestRotor = PARTS.rotors.reduce((best, r) =>
      Math.abs(r.portCount - state.rings[0].portCount) < Math.abs(best.portCount - state.rings[0].portCount) ? r : best
    );
    state.assembly.rotor = { ...bestRotor };
  } else {
    state.assembly.rotor = null;
  }

  // Horn: match by freq
  const bestHorn = PARTS.horns.reduce((best, h) =>
    Math.abs(h.freq - state.horn.freq) < Math.abs(best.freq - state.horn.freq) ? h : best
  );
  state.assembly.horn = { ...bestHorn };
}

function syncAssemblyToState() {
  const asm = state.assembly;
  if (asm.motor) {
    state.motor.maxRPM = asm.motor.maxRPM;
    state.motor.tauUp = asm.motor.tauUp;
  }
  if (asm.rotor) {
    state.motor.tauDown = asm.rotor.tauDown;
    state.rings = [{
      portCount: asm.rotor.portCount,
      portShape: 'rectangular',
      dutyCycle: 0.5,
      enabled: true,
    }];
    state.selectedRing = 0;
  }
  if (asm.horn) {
    state.horn.freq = asm.horn.freq;
    state.horn.Q = asm.horn.Q;
  }
  sendConfig();
  sendMotor();
  updateHornFilter();
}

function getAssemblyMessage() {
  const asm = state.assembly;
  if (!asm.motor && !asm.rotor) return 'Add a motor and rotor to make sound!';
  if (!asm.motor) return 'Add a motor to spin the rotor!';
  if (!asm.rotor) return 'Add a rotor to chop the air!';
  if (!asm.horn) return 'Add a horn to shape the sound! (optional)';
  return 'Your siren is ready! Switch to Tune mode to play.';
}

function renderBuildPanel() {
  let html = '<div class="build-panel">';

  // --- Parts Bin ---
  html += '<div class="parts-bin"><h3>Parts Bin</h3>';

  // Motors
  html += '<div class="parts-section"><div class="parts-section-title">Motors</div><div class="parts-row">';
  for (const m of PARTS.motors) {
    html += `<div class="part-card" draggable="true" data-part-type="motor" data-part-id="${m.id}">
      <span class="part-label">${m.label}</span>
      <span class="part-detail">${m.maxRPM} RPM</span>
    </div>`;
  }
  html += '</div></div>';

  // Rotors
  html += '<div class="parts-section"><div class="parts-section-title">Rotors</div><div class="parts-row">';
  for (const r of PARTS.rotors) {
    html += `<div class="part-card" draggable="true" data-part-type="rotor" data-part-id="${r.id}">
      <span class="part-label">${r.label}</span>
      <span class="part-detail">${r.portCount} holes</span>
    </div>`;
  }
  html += '</div></div>';

  // Horns
  html += '<div class="parts-section"><div class="parts-section-title">Horns</div><div class="parts-row">';
  for (const h of PARTS.horns) {
    html += `<div class="part-card" draggable="true" data-part-type="horn" data-part-id="${h.id}">
      <span class="part-label">${h.label}</span>
      <span class="part-detail">${h.freq} Hz, Q=${h.Q}</span>
    </div>`;
  }
  html += '</div></div>';
  html += '</div>'; // end parts-bin

  // --- Assembly Area ---
  html += '<div class="assembly-area"><h3>Assembly</h3><div class="assembly-slots">';

  // Horn slot (top)
  html += renderSlot('horn', 'Horn', state.assembly.horn);
  // Rotor slot (middle)
  html += renderSlot('rotor', 'Rotor', state.assembly.rotor);
  // Motor slot (bottom)
  html += renderSlot('motor', 'Motor', state.assembly.motor);

  html += '</div>'; // end assembly-slots

  // Message
  html += `<div class="assembly-message">${getAssemblyMessage()}</div>`;

  html += '</div>'; // end assembly-area

  // Clear button
  html += '<div class="build-actions"><button class="btn-clear-assembly" id="btn-clear-assembly">Clear All</button></div>';

  html += '</div>'; // end build-panel

  buildPanel.innerHTML = html;
  bindBuildEvents();
}

function renderSlot(type, label, part) {
  if (part) {
    let detail = '';
    if (type === 'motor') detail = `${part.maxRPM} RPM`;
    else if (type === 'rotor') detail = `${part.portCount} holes`;
    else if (type === 'horn') detail = `${part.freq} Hz, Q=${part.Q}`;

    return `<div class="assembly-slot filled" data-slot-type="${type}">
      <div>
        <div class="slot-part-name">${label}: ${part.label}</div>
        <div class="slot-part-detail">${detail}</div>
      </div>
      <button class="slot-remove" data-remove-slot="${type}">X</button>
    </div>`;
  }
  return `<div class="assembly-slot" data-slot-type="${type}">
    <span class="slot-label">Drop a ${label} here</span>
  </div>`;
}

function bindBuildEvents() {
  // Drag start on part cards
  buildPanel.querySelectorAll('.part-card').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('application/x-siren-part', JSON.stringify({
        type: card.dataset.partType,
        id: card.dataset.partId,
      }));
      e.dataTransfer.effectAllowed = 'copy';
    });
  });

  // Drop on slots
  buildPanel.querySelectorAll('.assembly-slot').forEach(slot => {
    slot.addEventListener('dragover', (e) => {
      e.preventDefault();
      slot.classList.add('drag-over');
      e.dataTransfer.dropEffect = 'copy';
    });

    slot.addEventListener('dragleave', () => {
      slot.classList.remove('drag-over');
    });

    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('application/x-siren-part');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        const slotType = slot.dataset.slotType;
        if (data.type !== slotType) return; // type mismatch
        placePart(slotType, data.id);
      } catch {}
    });
  });

  // Remove buttons
  buildPanel.querySelectorAll('[data-remove-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      const slotType = btn.dataset.removeSlot;
      state.assembly[slotType] = null;
      syncAssemblyToState();
      renderBuildPanel();
    });
  });

  // Clear all
  const clearBtn = document.getElementById('btn-clear-assembly');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      state.assembly.motor = null;
      state.assembly.rotor = null;
      state.assembly.horn = null;
      syncAssemblyToState();
      renderBuildPanel();
    });
  }
}

function placePart(type, partId) {
  let partList;
  if (type === 'motor') partList = PARTS.motors;
  else if (type === 'rotor') partList = PARTS.rotors;
  else if (type === 'horn') partList = PARTS.horns;
  else return;

  const part = partList.find(p => p.id === partId);
  if (!part) return;

  state.assembly[type] = { ...part };
  syncAssemblyToState();
  renderBuildPanel();
}

// ============================================================
// INITIALIZATION
// ============================================================
const tapOverlay = document.getElementById('tap-overlay');

tapOverlay.addEventListener('click', async () => {
  tapOverlay.classList.add('hidden');
  await initAudio();
  if (loadFromHash()) {
    sendConfig();
    sendMotor();
    sendVolume();
    updateHornFilter();
    applyEnvironmentPreset(state.environment.preset);
    updateDistance(state.environment.distance);
  }
  syncUIFromState();
  setupCanvas();
  setupWaveformCanvas();
  requestAnimationFrame(drawSiren);
});

window.addEventListener('resize', () => {
  if (audioReady) {
    setupCanvas();
    setupWaveformCanvas();
  }
});
</script>
</body>
</html>
