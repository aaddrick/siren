<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siren Creator!</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Tap-to-start overlay (required for AudioContext user gesture) -->
<div class="tap-overlay" id="tap-overlay">
  <h2>SIREN CREATOR</h2>
  <p>Tap anywhere to start!</p>
</div>

<!-- Title -->
<div class="title-bar">
  <h1>SIREN CREATOR</h1>
  <div class="mode-toggle-bar">
    <button class="mode-toggle-btn" id="btn-mode-build" data-appmode="build">&#x1F527; Build</button>
    <button class="mode-toggle-btn active" id="btn-mode-tune" data-appmode="tune">&#x1F39B;&#xFE0F; Tune</button>
  </div>
</div>

<!-- Canvas Area -->
<div class="canvas-area">
  <canvas id="rotor-canvas" width="400" height="500"></canvas>
  <div class="rpm-bar-container">
    <div class="rpm-bar-fill" id="rpm-bar"></div>
    <div class="rpm-label" id="rpm-label">0 RPM</div>
  </div>
  <div class="viz-toggle">
    <button class="viz-btn active" id="viz-wave">Wave</button>
    <button class="viz-btn" id="viz-spectrum">Spectrum</button>
  </div>
  <canvas id="waveform-canvas" width="400" height="80"></canvas>
  <div class="freq-display" id="freq-display"></div>
  <div class="error-banner" id="error-banner"></div>
</div>

<!-- Controls -->
<div class="controls">
  <!-- Tune Panel (default visible) -->
  <div id="tune-panel">
    <button class="btn-start" id="btn-start">START</button>

    <div class="control-group">
      <label>How Fast? <span class="value-display" id="speed-display">3450 RPM</span></label>
      <input type="range" id="speed-slider" min="500" max="10000" value="3450" step="50">
    </div>

    <div class="control-group">
      <label>Mode</label>
      <div class="mode-group">
        <button class="mode-btn active" data-mode="steady"><span class="icon">&#x2500;</span>STEADY</button>
        <button class="mode-btn" data-mode="wail"><span class="icon">&#x223F;</span>WAIL</button>
        <button class="mode-btn" data-mode="alert"><span class="icon">&#x2A5A;</span>ALERT</button>
      </div>
    </div>

    <div class="control-group">
      <label>Horn Shape</label>
      <div class="mode-group" id="horn-shape-group">
        <button class="mode-btn" data-horn="narrow"><span class="icon">&#x25B2;</span>Narrow</button>
        <button class="mode-btn active" data-horn="wide"><span class="icon">&#x2312;</span>Wide</button>
        <button class="mode-btn" data-horn="rectangular"><span class="icon">&#x25AC;</span>Square</button>
        <button class="mode-btn" data-horn="none"><span class="icon">&#x25CB;</span>None</button>
      </div>
    </div>

    <div class="control-group">
      <label>Rings</label>
      <div class="ring-controls" id="ring-controls"></div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn-small" id="btn-add-ring">+ Add Ring</button>
        <button class="btn-small" id="btn-swap-shutters">SWAP</button>
      </div>
    </div>

    <div class="control-group" id="selected-ring-controls" style="display:none">
      <label>Selected Ring <span class="value-display" id="ring-freq-display"></span></label>
      <div style="margin-bottom:10px">
        <label style="font-size:13px">Holes: <span class="value-display" id="port-count-display">10</span></label>
        <input type="range" id="port-count-slider" min="4" max="16" value="10" step="1">
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:13px">Stator Slot Size: <span class="value-display" id="stator-duty-display">50%</span></label>
        <input type="range" id="stator-duty-slider" min="20" max="80" value="50" step="1">
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:13px">Rotor Hole Size: <span class="value-display" id="rotor-duty-display">50%</span></label>
        <input type="range" id="rotor-duty-slider" min="20" max="80" value="50" step="1">
      </div>
      <div>
        <label style="font-size:13px">Hole Shape:</label>
        <div class="shape-toggle">
          <button class="shape-btn active" data-shape="rectangular">&#x25A0; Square</button>
          <button class="shape-btn" data-shape="round">&#x25CF; Round</button>
        </div>
      </div>
    </div>

    <div class="control-group">
      <label>Volume <span class="value-display" id="volume-display">70%</span></label>
      <input type="range" id="volume-slider" min="0" max="100" value="70" step="1">
    </div>

    <div class="control-group">
      <label>Distance <span class="value-display" id="distance-display">0%</span></label>
      <input type="range" id="distance-slider" min="0" max="100" value="0" step="1">
    </div>

    <div class="control-group">
      <label>Environment</label>
      <div class="mode-group">
        <button class="mode-btn env-btn active" data-env="outdoor"><span class="icon">&#x1F33E;</span>Outdoor</button>
        <button class="mode-btn env-btn" data-env="downtown"><span class="icon">&#x1F3D9;&#xFE0F;</span>Downtown</button>
        <button class="mode-btn env-btn" data-env="indoor"><span class="icon">&#x1F3E0;</span>Indoor</button>
        <button class="mode-btn env-btn" data-env="tornado"><span class="icon">&#x1F32A;&#xFE0F;</span>Tornado</button>
      </div>
    </div>

    <button class="advanced-toggle" id="advanced-toggle">Advanced Settings &#x25BC;</button>
    <div class="advanced-content" id="advanced-content">
      <div class="control-group">
        <label>Motor Power <span class="value-display" id="power-display">50%</span></label>
        <input type="range" id="power-slider" min="10" max="100" value="50" step="1">
      </div>
      <div class="control-group">
        <label>Rotor Weight <span class="value-display" id="weight-display">50%</span></label>
        <input type="range" id="weight-slider" min="10" max="100" value="50" step="1">
      </div>
      <div class="control-group" id="wail-speed-group" style="display:none">
        <label>Wail Speed <span class="value-display" id="wail-display">10s</span></label>
        <input type="range" id="wail-slider" min="4" max="20" value="10" step="1">
      </div>
    </div>
  </div>

  <!-- Build Panel (hidden by default) -->
  <div id="build-panel" style="display:none"></div>
</div>

<!-- Presets Bar -->
<div class="presets-bar">
  <button class="preset-btn" data-preset="thunderbolt"><span class="icon">&#x1F32A;&#xFE0F;</span>Tornado</button>
  <button class="preset-btn" data-preset="city"><span class="icon">&#x1F3D9;&#xFE0F;</span>City</button>
  <button class="preset-btn" data-preset="airraid"><span class="icon">&#x2708;&#xFE0F;</span>Air Raid</button>
  <button class="preset-btn" data-preset="simple"><span class="icon">&#x1F514;</span>Simple</button>
  <button class="preset-btn" data-preset="chrysler"><span class="icon">&#x1F4A3;</span>Chrysler</button>
  <button class="preset-btn" data-preset="model2"><span class="icon">&#x1F4E1;</span>Model 2</button>
  <button class="preset-btn" data-preset="federal500"><span class="icon">&#x1F692;</span>Federal 500</button>
  <button class="preset-btn" data-preset="m65"><span class="icon">&#x1F3DA;&#xFE0F;</span>Sentry M-65</button>
  <div class="save-load-btns">
    <button class="btn-save" id="btn-save">Save</button>
    <button class="btn-load" id="btn-load">Load</button>
    <button class="btn-share" id="btn-share">Copy Link</button>
    <button class="btn-record" id="btn-record" disabled>Record</button>
  </div>
</div>

<!-- Save Modal -->
<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h2>Save Your Siren</h2>
    <input type="text" id="save-name" placeholder="My Cool Siren" value="">
    <div class="modal-actions">
      <button class="btn-modal secondary" id="save-cancel">Cancel</button>
      <button class="btn-modal primary" id="save-confirm">SAVE!</button>
    </div>
  </div>
</div>

<!-- Load Modal -->
<div class="modal-overlay" id="load-modal">
  <div class="modal">
    <h2>Load a Siren</h2>
    <div id="save-list"></div>
    <div class="modal-actions">
      <button class="btn-modal secondary" id="load-cancel">Close</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/worklet.js"></script>
<script src="js/audio.js"></script>
<script src="js/canvas.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
</body>
</html>
